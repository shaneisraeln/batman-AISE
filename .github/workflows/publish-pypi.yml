name: Publish batman-ml to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository (pypi or testpypi)'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build SDK package
        run: |
          cd sdk
          python -m build

      - name: Check package metadata with twine
        run: |
          python -m twine check sdk/dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.repository }}" = "testpypi" ]; then
            python -m twine upload --repository testpypi sdk/dist/*
          else
            python -m twine upload sdk/dist/*
          fi
