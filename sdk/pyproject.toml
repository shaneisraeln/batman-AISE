[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batman-ml"
version = "0.1.0"
description = "Lightweight Python client for BATMAN — runtime security for ML inference APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BATMAN" }]
keywords = ["ml", "security", "inference", "model-extraction", "anomaly-detection", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately minimal: the client is a thin HTTP wrapper. No engine, no sklearn,
# no numpy required. numpy arrays are supported if the caller already has numpy,
# but it is NOT a dependency.
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/shaneisraeln/batman-AISE"
Documentation = "https://github.com/shaneisraeln/batman-AISE/tree/main/docs"
Source = "https://github.com/shaneisraeln/batman-AISE"

[tool.setuptools.packages.find]
include = ["batman_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
